name = "mqm-watch"
main = "worker.js"
compatibility_date = "2026-10-01"
# не удалять переменные, добавленные в панели Cloudflare, при выкладке из GitHub
keep_vars = true

# каждую минуту; частоту проверок задаёт страница управления
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "MQM_KV"
id = "3876d11e0fd14259ab6aa15d6b5b3b69"

[observability]
enabled = true

# номер и время версии — показываются на странице управления
[version_metadata]
binding = "CF_VERSION_METADATA"
